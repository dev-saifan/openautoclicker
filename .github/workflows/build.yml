name: Build OpenAutoClicker

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Zig
      uses: mlugg/setup-zig@v1
      with:
        zig-version: latest

    - name: Compile with Zig CC (Auto-links resource.syso)
      run: |
        zig cc openautoclicker.c resource.syso -o OpenAutoClicker.exe -lcomctl32 -lgdi32 -Wl,--subsystem,windows -O2

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenAutoClicker-Windows
        path: OpenAutoClicker.exe
