name: Build OpenAutoClicker

on:
  push:
    branches: [ "main", "master" ]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile with Clang
      run: |
        clang openautoclicker.c resource.syso -o OpenAutoClicker.exe -lcomctl32 -lgdi32 '-Wl,--subsystem,windows' -O2

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenAutoClicker-Windows
        path: OpenAutoClicker.exe

    - name: Upload to Release (If Published)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: OpenAutoClicker.exe
